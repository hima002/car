name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Generate debug keystore (only if not already committed)
        # debug.keystore is committed to the repo so its SHA-1 stays stable across builds —
        # Google API key "Android app" restrictions (SHA-1 + package name) need a fixed signature,
        # and a fresh keystore every run breaks that match. Only regenerate if it's ever missing.
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Write .env from repository secrets
        # An empty value here generates invalid Java in BuildConfig (`= ;`), so fall back to a
        # placeholder if a secret isn't configured yet rather than writing a blank value.
        env:
          PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "PLACES_API_KEY=${PLACES_API_KEY:-MISSING}" > .env
          echo "GEMINI_API_KEY=${GEMINI_API_KEY:-MISSING}" >> .env

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 9.1.1 requires Gradle >= 9.3.1.
          gradle-version: 9.3.1

      - name: Build debug APK
        # kotlin.compiler.execution.strategy is forced to "in-process" in gradle.properties
        # (needed locally to avoid a compile-daemon connection error). On CI that setting makes
        # the Kotlin compiler share Gradle's own classloader, which collides with the Compose
        # compiler plugin jar and crashes with an AbstractMethodError. Override to out-of-process
        # here only, so the local dev workaround stays intact.
        run: gradle assembleDebug --stacktrace -Pkotlin.compiler.execution.strategy=out-of-process

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alwarsha-debug-apk
          path: app/build/outputs/apk/debug/*.apk
