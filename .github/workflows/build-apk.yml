name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create empty .env (secrets plugin falls back to .env.example otherwise)
        run: touch .env

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        # kotlin.compiler.execution.strategy is forced to "in-process" in gradle.properties
        # (needed locally to avoid a compile-daemon connection error). On CI that setting makes
        # the Kotlin compiler share Gradle's own classloader, which collides with the Compose
        # compiler plugin jar and crashes with an AbstractMethodError. Override to out-of-process
        # here only, so the local dev workaround stays intact.
        run: gradle assembleDebug --stacktrace -Pkotlin.compiler.execution.strategy=out-of-process

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autokeep-debug-apk
          path: app/build/outputs/apk/debug/*.apk
